<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Weather Rating</title>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2ecc71;
            --background: #f9f9f9;
            --text: #333;
            --card: #fff;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background);
            color: var(--text);
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 4px 12px var(--shadow);
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .location-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            font-size: 1.2rem;
        }

        .location-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
        }

        .location-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.4);
        }

        .location-display {
            margin-left: 15px;
            font-weight: 500;
        }

        .forecast-container {
            display: flex;
            overflow-x: auto;
            padding: 20px 0;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .day-card {
            min-width: 140px;
            background-color: var(--card);
            border-radius: 15px;
            padding: 15px;
            margin-right: 15px;
            box-shadow: 0 4px 12px var(--shadow);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .day-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px var(--shadow);
        }

        .day-card.active {
            border: 2px solid var(--primary);
            transform: translateY(-5px);
        }

        .day-name {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .day-date {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .weather-icon {
            width: 50px;
            height: 50px;
            margin: 0 auto;
        }

        .rating {
            margin-top: 15px;
            font-size: 1.8rem;
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        .rating::after {
            content: '/100';
            font-size: 1rem;
            opacity: 0.7;
            vertical-align: super;
            margin-left: 2px;
        }

        .hourly-container {
            margin-top: 30px;
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hourly-title {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .hourly-card {
            background-color: var(--card);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: slideIn 0.3s ease forwards;
            transition: all 0.3s ease;
        }

        .hourly-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px var(--shadow);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .hour {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .hour-weather {
            font-size: 0.9rem;
            margin: 5px 0;
        }

        .hour-rating {
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 10px;
            position: relative;
        }

        .hour-rating::after {
            content: '/100';
            font-size: 0.8rem;
            opacity: 0.7;
            vertical-align: super;
            margin-left: 2px;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(52, 152, 219, 0.2);
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            padding: 20px;
            background-color: rgba(231, 76, 60, 0.1);
            border-radius: 8px;
            margin: 20px 0;
        }

        .permission-dialog {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .permission-content {
            background-color: white;
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease forwards;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .permission-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .permission-message {
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .permission-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .permission-allow {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .permission-deny {
            background-color: #e0e0e0;
            color: #666;
            border: none;
            padding: 12px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .permission-allow:hover, .permission-deny:hover {
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #777;
            font-size: 0.9rem;
        }

        /* Rating color classes */
        .excellent {
            color: #27ae60;
        }

        .good {
            color: #2ecc71;
        }

        .moderate {
            color: #f39c12;
        }

        .poor {
            color: #e67e22;
        }

        .bad {
            color: #e74c3c;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .hourly-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Bike Weather Rating</h1>
        <div class="subtitle">Find the perfect time for your ride</div>
    </header>

    <div class="container">
        <div class="location-container">
            <button id="getLocation" class="location-btn">
                <span id="locationButtonText">Update Location</span>
            </button>
            <div class="location-display" id="locationDisplay"></div>
        </div>

        <div id="content">
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Looking up the sky for you...</p>
            </div>
        </div>

        <div id="forecastContainer" style="display: none;">
            <div class="forecast-container" id="daysContainer">
                <!-- Daily forecast cards will be inserted here -->
            </div>

            <div class="hourly-container" id="hourlyContainer">
                <h2 class="hourly-title" id="hourlyTitle">Hourly Forecast</h2>
                <div class="hourly-grid" id="hourlyGrid">
                    <!-- Hourly forecast cards will be inserted here -->
                </div>
            </div>
        </div>

        <footer>
            <p>Weather data provided by WeatherAPI.com</p>
        </footer>
    </div>

    <!-- Permission Dialog -->
    <div class="permission-dialog" id="permissionDialog">
        <div class="permission-content">
            <div class="permission-title">Location Access</div>
            <div class="permission-message">
                This app needs your location to show you the best bike riding times in your area. Would you like to share your location?
            </div>
            <div class="permission-buttons">
                <button class="permission-allow" id="allowLocation">Allow</button>
                <button class="permission-deny" id="denyLocation">Not Now</button>
            </div>
        </div>
    </div>

    <script>
        // API key
        const API_KEY = 'ebdde239526f4887af1201848251404';
        let currentLocation = '';
        let forecastData = null;

        // DOM elements
        const getLocationBtn = document.getElementById('getLocation');
        const locationButtonText = document.getElementById('locationButtonText');
        const locationDisplay = document.getElementById('locationDisplay');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const forecastContainer = document.getElementById('forecastContainer');
        const daysContainer = document.getElementById('daysContainer');
        const hourlyContainer = document.getElementById('hourlyContainer');
        const hourlyTitle = document.getElementById('hourlyTitle');
        const hourlyGrid = document.getElementById('hourlyGrid');
        const content = document.getElementById('content');
        const permissionDialog = document.getElementById('permissionDialog');
        const allowLocationBtn = document.getElementById('allowLocation');
        const denyLocationBtn = document.getElementById('denyLocation');

        // Event listeners
        getLocationBtn.addEventListener('click', showPermissionDialog);
        allowLocationBtn.addEventListener('click', requestLocation);
        denyLocationBtn.addEventListener('click', handleLocationDenied);

        // Show permission dialog
        function showPermissionDialog() {
            permissionDialog.style.display = 'flex';
        }

        // Hide permission dialog
        function hidePermissionDialog() {
            permissionDialog.style.display = 'none';
        }

        // Request location permission
        function requestLocation() {
            hidePermissionDialog();
            locationButtonText.textContent = "Getting location...";
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    successCallback, 
                    errorCallback,
                    { enableHighAccuracy: true }
                );
            } else {
                showError("Geolocation is not supported by your browser");
                locationButtonText.textContent = "Update Location";
            }
        }

        // Handle location permission denied
        function handleLocationDenied() {
            hidePermissionDialog();
            showError("Location access is required to show weather in your area");
            locationButtonText.textContent = "Update Location";
        }

        // Success callback for geolocation
        function successCallback(position) {
            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;
            
            locationButtonText.textContent = "Update Location";
            fetchWeatherForecast(latitude, longitude);
        }

        // Error callback for geolocation
        function errorCallback(error) {
            let message = "";
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = "Location access was denied";
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = "Location information is unavailable";
                    break;
                case error.TIMEOUT:
                    message = "Request timed out";
                    break;
                case error.UNKNOWN_ERROR:
                    message = "An unknown error occurred";
                    break;
            }
            showError(message);
            locationButtonText.textContent = "Update Location";
        }

        // Fetch weather forecast data
        async function fetchWeatherForecast(latitude, longitude) {
            showLoading();
            
            try {
                const response = await fetch(`https://api.weatherapi.com/v1/forecast.json?key=${API_KEY}&q=${latitude},${longitude}&days=7&aqi=no&alerts=no`);
                
                if (!response.ok) {
                    throw new Error('Weather data not available');
                }
                
                const data = await response.json();
                forecastData = data;
                
                // Update location display
                currentLocation = `${data.location.name}, ${data.location.country}`;
                locationDisplay.textContent = currentLocation;
                
                // Render forecast
                renderDailyForecast(data);
                hideLoading();
            } catch (error) {
                showError("Failed to fetch weather data: " + error.message);
                hideLoading();
            }
        }

        // Calculate bike rating score (1-100)
        function calculateBikeRating(weather) {
            // Base scores for different factors (all out of 100)
            let temperatureScore = 0;
            let precipitationScore = 0;
            let windScore = 0;
            let visibilityScore = 0;
            let uvScore = 0;
            
            // Temperature rating (ideal: 15-25°C)
            const temp_c = weather.temp_c;
            if (temp_c < 0) {
                temperatureScore = 10;
            } else if (temp_c < 5) {
                temperatureScore = 30;
            } else if (temp_c < 10) {
                temperatureScore = 50;
            } else if (temp_c < 15) {
                temperatureScore = 70;
            } else if (temp_c <= 25) {
                temperatureScore = 100;
            } else if (temp_c <= 30) {
                temperatureScore = 70;
            } else if (temp_c <= 35) {
                temperatureScore = 40;
            } else {
                temperatureScore = 20;
            }
            
            // Precipitation rating
            const precip_mm = weather.precip_mm || 0;
            if (precip_mm === 0) {
                precipitationScore = 100;
            } else if (precip_mm < 0.5) {
                precipitationScore = 80;
            } else if (precip_mm < 2) {
                precipitationScore = 50;
            } else if (precip_mm < 5) {
                precipitationScore = 20;
            } else {
                precipitationScore = 0;
            }
            
            // Wind rating (lower is better)
            const wind_kph = weather.wind_kph;
            if (wind_kph < 5) {
                windScore = 100;
            } else if (wind_kph < 10) {
                windScore = 85;
            } else if (wind_kph < 20) {
                windScore = 60;
            } else if (wind_kph < 30) {
                windScore = 40;
            } else if (wind_kph < 40) {
                windScore = 20;
            } else {
                windScore = 0;
            }
            
            // Visibility rating
            const vis_km = weather.vis_km || 10;
            if (vis_km > 9) {
                visibilityScore = 100;
            } else if (vis_km > 7) {
                visibilityScore = 80;
            } else if (vis_km > 5) {
                visibilityScore = 60;
            } else if (vis_km > 3) {
                visibilityScore = 40;
            } else {
                visibilityScore = 20;
            }
            
            // UV rating (moderate UV is fine, high UV is not good for long rides)
            const uv = weather.uv || 0;
            if (uv <= 2) {
                uvScore = 100;
            } else if (uv <= 5) {
                uvScore = 80;
            } else if (uv <= 7) {
                uvScore = 60;
            } else if (uv <= 10) {
                uvScore = 40;
            } else {
                uvScore = 20;
            }
            
            // Calculate final score (weighted average)
            const finalScore = Math.round(
                (temperatureScore * 0.3) +
                (precipitationScore * 0.3) +
                (windScore * 0.2) +
                (visibilityScore * 0.1) +
                (uvScore * 0.1)
            );
            
            return Math.max(1, Math.min(100, finalScore));
        }

        // Get rating class based on score
        function getRatingClass(score) {
            if (score >= 80) return 'excellent';
            if (score >= 60) return 'good';
            if (score >= 40) return 'moderate';
            if (score >= 20) return 'poor';
            return 'bad';
        }

        // Format date
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        // Format day of week
        function getDayOfWeek(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { weekday: 'short' });
        }
